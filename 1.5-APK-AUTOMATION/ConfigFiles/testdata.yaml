audio_caption_script:
  script_2: "2 Alex and Jason real talk. Hey Jason, it's been ages. How's it going buddy? No way. I remember how much you loved fishing back in the day. Tell me everything. Have you caught any big ones? Yeah, that's incredible Jason. You always had a knack for landing the big ones. Any photos to show off your impressive catch? Wow, that's a trophy worth worthy bass my friend. You definitely got your fishing skills intact. Unfortunately, not as much as I'd like. I've been pretty busy lately, but I managed to squeeze an fishing trip last month. Didn't catch anything remarkable though. Just a few decent sized trout. Actually yes. I experimented with some fly fishing techniques I learned from a friend. It was a whole new experience for me. I had to say I enjoyed the change of pace. Absolutely Jason, we need to make that happen. A fishing trip with you is always a blast. Maybe we can even organize a weekend getaway with the whole gang. Awesome, I'll start checking out some potential fishing spots and accommodations. We'll make it a memorable trip. Definitely Jason, life gets busy, but we can't forget the things that bring us joy and keep our friendship strong. Agreed Jason Well, I won't keep you any longer. Enjoy your next fishing adventure and let's stay in touch. Thanks Jason. Take care and catch you later. Bye."
  script_3: "2 Alex and Jason real talk. Hey Jason, it's been ages. How's it going buddy? No way. I remember how much you loved fishing back in the day. Tell me everything. Have you caught any big ones? Yeah, that's incredible Jason. You always had a knack for landing the big ones. Any photos to show off your impressive catch? Wow, that's a trophy worth worthy bass my friend. You definitely got your fishing skills intact. Unfortunately, not as much as I'd like. I've been pretty busy lately, but I managed to squeeze an fishing trip last month. Didn't catch anything remarkable though. Just a few decent sized trout. Actually yes. I experimented with some fly fishing techniques I learned from a friend. It was a whole new experience for me. I had to say I enjoyed the change of pace. Absolutely Jason, we need to make that happen. A fishing trip with you is always a blast. Maybe we can even organize a weekend getaway with the whole gang. Awesome, I'll start checking out some potential fishing spots and accommodations. We'll make it a memorable trip. Definitely Jason, life gets busy, but we can't forget the things that bring us joy and keep our friendship strong. Agreed Jason Well, I won't keep you any longer. Enjoy your next fishing adventure and let's stay in touch. Thanks Jason. Take care and catch you later. Bye."

